name: Terraform PR Plan

on:
  pull_request:
    paths:
      - "environments/dev/**"
      - "modules/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-pr-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan dev (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_USE_CLI: false
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Initialize Terraform
        run: terraform init -input=false -reconfigure

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Create speculative plan
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=pr-plan.tfplan

      - name: Render plan output
        if: always()
        run: |
          {
            echo "### Terraform dev plan"
            echo ""
            echo "This is a speculative, read-only plan against the \`dev\` environment."
            echo "It is never applied automatically."
            echo ""
            echo '```'
            terraform show -no-color pr-plan.tfplan 2>/dev/null || echo "(no saved plan output)"
            echo '```'
          } > pr-plan-comment.md

      - name: Post plan as PR comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-dev-plan
          path: environments/dev/pr-plan-comment.md
