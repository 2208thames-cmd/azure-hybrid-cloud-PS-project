name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [dev, test, prod]
      plan_run_id:
        description: GitHub Actions run ID that produced the reviewed plan
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_USE_CLI: false
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}-${{ inputs.plan_run_id }}
          path: environments/${{ inputs.environment }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Initialize Terraform
        run: terraform init -input=false -reconfigure

      - name: Apply exact reviewed plan
        run: terraform apply -input=false tfplan