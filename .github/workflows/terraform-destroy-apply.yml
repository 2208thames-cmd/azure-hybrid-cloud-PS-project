name: Terraform Destroy Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options: [dev, test, prod]
      plan_run_id:
        description: GitHub Actions run ID that produced the reviewed destroy plan
        required: true
        type: string
      source_commit:
        description: Exact commit SHA recorded by the destroy plan workflow
        required: true
        type: string
      confirmation:
        description: Type DESTROY to authorize destroying the exact reviewed plan
        required: true
        type: choice
        options: [CANCEL, DESTROY]

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

concurrency:
  group: terraform-destroy-apply-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy-apply:
    name: Destroy ${{ inputs.environment }}
    if: ${{ inputs.confirmation == 'DESTROY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_USE_CLI: false
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/${{ inputs.environment }}

    steps:
      - name: Check out exact destroy plan source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - name: Verify checked-out commit
        shell: bash
        run: |
          actual_commit="$(git rev-parse HEAD)"
          test "$actual_commit" = "${{ inputs.source_commit }}"

      - name: Download exact reviewed destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan-${{ inputs.environment }}-${{ inputs.plan_run_id }}
          path: environments/${{ inputs.environment }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Verify destroy plan metadata
        shell: bash
        run: |
          test "$(grep '^operation=' plan-metadata.txt | cut -d= -f2)" = "destroy"
          test "$(grep '^environment=' plan-metadata.txt | cut -d= -f2)" = "${{ inputs.environment }}"
          test "$(grep '^source_commit=' plan-metadata.txt | cut -d= -f2)" = "${{ inputs.source_commit }}"

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Initialize Terraform
        run: terraform init -input=false -reconfigure

      - name: Apply exact reviewed destroy plan
        run: terraform apply -input=false tfplan

      - name: Open failure notification issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ inputs.environment }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const name of ['terraform-failure', environment]) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
              } catch {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color: 'd73a4a' });
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Terraform destroy failed: ${environment}`,
              body: `The Terraform Destroy Apply workflow failed for \`${environment}\` at commit \`${{ inputs.source_commit }}\`.\n\nRun: ${runUrl}\n\nCheck for a stale state lock and partially destroyed resources before retrying.`,
              labels: ['terraform-failure', environment],
            });